[project]
name = "bond_tasks_py"
version = "0.2.0"
description = "Task models, services and reminder scheduling"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "sqlalchemy>=2.0.36",
    "pydantic>=2.8",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27", "psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bond_tasks_py*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a PostgreSQL database (BOND_TEST_POSTGRES_URL); skipped when unset"]
