[project]
name = "bond_sync_py"
version = "0.1.0"
description = "Sync core: change batches, signed tokens and upload handling"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.8",
    "PyJWT>=2.8",
    "cryptography>=42",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bond_sync_py*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
