[project]
name = "bond_auth_py"
version = "0.2.0"
description = "Firebase ID token verification and auth dependencies"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PyJWT>=2.10",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
firebase = ["firebase-admin>=6.5"]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27", "firebase-admin>=6.5"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bond_auth_py*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
