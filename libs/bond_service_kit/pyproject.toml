[project]
name = "bond_service_kit"
version = "0.1.0"
description = "FastAPI and SQLAlchemy plumbing shared by the bond services"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bond_service_kit*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
