[project]
name = "sdk_example"
version = "0.1.0"
description = "Reference FastAPI app wiring every bond Python lib (phase 1: skeleton with /health; routes land in phases 2 and 3)."
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13",
    "pydantic>=2.8",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "bond_service_kit",
    "bond_storage",
    "bond_auth_py[firebase]",
    "bond_jobs",
    "bond_sync_py",
    "bond_oauth",
    "bond_calendar",
    "bond_tasks_py",
    "bond_signin",
    "bond_notify_py",
    "bond_push_py",
    "bond_capture_py",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27", "psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdk_example*"]

[tool.uv.sources]
bond_service_kit = { workspace = true }
bond_storage = { workspace = true }
bond_auth_py = { workspace = true }
bond_jobs = { workspace = true }
bond_sync_py = { workspace = true }
bond_oauth = { workspace = true }
bond_calendar = { workspace = true }
bond_tasks_py = { workspace = true }
bond_signin = { workspace = true }
bond_notify_py = { workspace = true }
bond_push_py = { workspace = true }
bond_capture_py = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
