[project]
name = "roof-measure"
version = "0.5.1"
description = "Address -> roof measurement (county or OpenStreetMap footprint + USGS 3DEP LiDAR + a plane engine) as an importable library."
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "shapely>=2.1",
    "pyproj>=3.6",
    "laspy[lazrs]>=2.5",
    "requests>=2.32",
]

[project.optional-dependencies]
render = ["matplotlib>=3.9"]  # tools/roof_eval pictures (not the library)
label = ["anthropic>=0.60"]  # tools/roof_eval/label only (offline labelling of the regression set; never the library)
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["roof_measure*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs the live network (skipped unless ROOF_MEASURE_NETWORK=1)"]
