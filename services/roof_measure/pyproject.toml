[project]
name = "roof-measure"
version = "0.1.0"
description = "Address -> roof model JSON (footprint + USGS 3DEP LiDAR, optionally Google Solar + a Claude agent). POC."
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "laspy[lazrs]>=2.5",
    "requests>=2.32",
    "matplotlib>=3.9",
    "compas_cgal>=0.10.0",
    "anthropic>=0.60",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
roof-measure = "roof_measure.cli:main"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["roof_measure*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs the live network (skipped unless ROOF_MEASURE_NETWORK=1)"]
